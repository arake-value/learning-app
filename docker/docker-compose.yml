
services:
  app-db:
    image: postgres:15
    container_name: app-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - app-data:/var/lib/postgresql/data

  app:
    build: ..
    image: learning-app:latest
    container_name: app
    depends_on:
      - app-db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://app-db:5432/app_db
      DB_USER: user
      DB_PASSWORD: password
volumes:
  app-data: